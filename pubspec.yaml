name: gs_frontend

description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons:
    ^1.0.8

    # State management
  flutter_bloc: ^9.1.1

  # Secure storage
  flutter_secure_storage: ^9.2.4

  # Dependency injection
  get_it: ^9.0.5

  # Error handling
  fpdart: ^1.2.0

  # Make HTTP requests
  http: ^1.6.0

  # Pin input
  pinput: ^5.0.2

  # Format dates and times
  intl: ^0.20.2

  # Page indicator
  smooth_page_indicator: ^1.2.1

  # Validate emails
  email_validator: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
